<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- Without this, phones assume a ~980px layout and scale the whole page down. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#08161B">
<title>BetOnline MLB odds</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --field:#08161B; --panel:#0D2028; --panel2:#112932; --line:#1D3A44;
  --ink:#DCE6E4; --dim:#7B968F; --chalk:#F2F7F5;
  --m2:#F07E7C; --m5:#EFC24B; --m10:#5DCAA5; --live:#5A1414;
}
*{box-sizing:border-box}
body{margin:0;background:var(--field);color:var(--ink);
     font-family:"Roboto Mono",ui-monospace,monospace;font-size:13px;
     -webkit-text-size-adjust:100%}
header{position:sticky;top:0;z-index:20;background:var(--field);
       border-bottom:1px solid var(--line)}
.legend{display:flex;font-size:11px;font-weight:500}
.legend div{flex:1;text-align:center;padding:4px 2px;color:#0A1518}
.bar{display:flex;justify-content:space-between;align-items:baseline;
     gap:10px;padding:8px 14px}
.bar h1{margin:0;font-size:15px;font-weight:700;color:var(--chalk);letter-spacing:.5px}
.bar .meta{font-size:11px;color:var(--dim);text-align:right}

/* shared bits */
.team{color:var(--chalk);font-weight:500}
.pit{color:var(--dim);font-size:10px;line-height:1.35}
.run{color:var(--m10);font-weight:700;font-size:16px;line-height:1.1}
.st{font-size:10px;color:var(--dim)}
.st.live{color:var(--m5);font-weight:500}
.st.warm{color:var(--m10)}
.st.fin{color:var(--m10);font-weight:700}
/* Possession dot, in the same amber as the live clock so the two read as one
   piece of live state. */
.ball{color:var(--m5);width:13px;height:8px;margin-right:5px;
      vertical-align:baseline;flex:0 0 auto}
/* Same colour as the game time above it -- the drive line is context, not an
   alert, so the RZ badge carries the emphasis instead of the whole string. */
.drv{font-size:10px;color:var(--m5);line-height:1.3;white-space:nowrap}
.lp{font-size:10px;color:var(--m5);line-height:1.35;white-space:nowrap}
.wp{font-size:10px;color:var(--m10);line-height:1.35;white-space:nowrap}
/* A pitching change is the one live event that reliably moves a total. */
.chg{background:var(--m2);color:#04161A;border-radius:3px;padding:0 3px;
     margin-right:4px;font-size:9px;font-weight:700}
/* Red fill with a yellow outline: a started game already has a dark red row
   background, so red-on-red needs the border to separate it. The outline
   clears 6:1 against both the red row and the normal panel. */
.rzb{display:inline-block;background:#D93A38;color:#FFFFFF;
     border:1px solid var(--m5);border-radius:3px;
     padding:0 3px;margin-right:4px;font-size:9px;font-weight:700;
     letter-spacing:.5px;vertical-align:1px}
.rank{color:var(--m5);font-size:10px;font-weight:700;margin-right:3px;
      vertical-align:top}
.neu{display:inline-block;margin-top:3px;font-size:10px;font-weight:700;
     letter-spacing:.5px;color:#04161A;background:var(--m10);
     border-radius:3px;padding:1px 5px}
.side{color:var(--dim);font-size:11px;display:inline-block;min-width:36px;
      max-width:92px;text-align:left;overflow:hidden;text-overflow:ellipsis;
      white-space:nowrap;vertical-align:bottom}
/* Highlight chip. The colour is !important on purpose: .mv is a state class
   that has to win over whatever text colour the surrounding cell sets, and
   relying on declaration order broke once already (pale ink on yellow at
   1.3:1). Near-black rather than pure black -- softer on an always-on
   monitor, still 12:1+ against every band. */
.mv{border-radius:3px;padding:1px 5px;font-weight:700;
    color:#04161A !important;text-shadow:none}
.mv2{background:var(--m2)!important}
.mv5{background:var(--m5)!important}
.mv10{background:var(--m10)!important}
/* The trailing dot sits outside the chip, so it keeps card colour. */
.mv+.dot{color:var(--m10)}
.dot{color:var(--m10);font-size:10px;margin-left:3px}
.tabs{display:flex;gap:0;border-bottom:1px solid var(--line);
      overflow-x:auto;-webkit-overflow-scrolling:touch}
.tabs button{flex:0 0 auto;background:none;border:0;border-bottom:2px solid transparent;
  color:var(--dim);font-family:inherit;font-size:13px;font-weight:500;
  letter-spacing:.5px;padding:9px 18px;cursor:pointer;white-space:nowrap}
.tabs button:hover{color:var(--ink)}
.tabs button.on{color:var(--chalk);border-bottom-color:var(--m10)}
.tabs .n{color:var(--dim);font-weight:400;margin-left:6px;font-size:11px}
.tabs button.on .n{color:var(--m10)}
.boxable{cursor:pointer}
.boxable:hover{outline:1px solid var(--m10);outline-offset:-1px}
table.box{width:auto;border-collapse:collapse;font-size:11px;margin-bottom:6px}
table.box th{position:static;background:none;border:0;padding:2px 7px;
             color:var(--dim);font-weight:500;text-align:right;font-size:10px}
table.box td{border:0;padding:2px 7px;text-align:right;background:none;
             color:var(--ink)}
table.box .bt{text-align:left;color:var(--chalk);font-weight:500;padding-right:14px}
table.box .tot{color:var(--m10);font-weight:700}
/* Stacked rather than a single row: three leaders side by side overflow the
   panel and get clipped at the right edge. */
.leads{display:flex;flex-direction:column;gap:3px;margin-top:6px;
       white-space:normal}
.lead{font-size:10px;display:flex;gap:8px;align-items:baseline}
.lcat{color:var(--dim);flex:0 0 34px}
.lwho{color:var(--chalk);flex:0 0 auto}
.lval{color:var(--ink);flex:1;min-width:0}
.lcat{color:var(--dim);margin-right:6px}
.lwho{color:var(--chalk);margin-right:6px}
.lval{color:var(--ink)}
.bmsg{color:var(--dim);font-size:11px}
.empty{padding:40px;text-align:center;color:var(--dim)}

/* ── desktop table ───────────────────────────────────────────── */
table{width:100%;border-collapse:collapse}
thead th{position:sticky;top:52px;background:var(--panel2);color:var(--dim);
         font-size:11px;font-weight:500;text-align:center;padding:5px 6px;
         border-bottom:1px solid var(--line);white-space:nowrap}
thead th.l{text-align:left}
td{padding:3px 6px;border-bottom:1px solid rgba(29,58,68,.5);
   text-align:center;white-space:nowrap;vertical-align:top}
td.l{text-align:left}
/* One team per line. Previously both were inline-block, so with no pitcher
   between them -- football has none -- they ran together on a single row. */
td.l .trow{display:flex;justify-content:space-between;align-items:center;
           gap:10px;white-space:normal;line-height:1.3;max-width:250px}
td.l .tname{flex:1;min-width:0}
td.l .run{flex:0 0 auto;text-align:right}
td.l .team{white-space:normal}
td.l .rank{vertical-align:baseline}
tr.g0{background:var(--panel)} tr.g1{background:var(--panel2)}
tr.started td{background:var(--live)}
tr.slate td{background:var(--field);color:var(--chalk);font-weight:700;
            font-size:12px;letter-spacing:1px;text-align:left;
            padding:8px 14px 5px;border-bottom:1px solid var(--line)}
td.hot{cursor:pointer}
td.hot:hover{outline:1px solid var(--m10);outline-offset:-1px}
td.sel{outline:1px solid var(--chalk);outline-offset:-1px}
.time{color:var(--dim);font-size:11px}
.open{color:var(--dim)}
/* Opening price, shown under the current one on sides that moved. */
.opn{color:var(--dim);font-size:10px;line-height:1.3;opacity:.75}
.cur{color:var(--ink)}
tr.det td{background:#061014;padding:0;text-align:left}
.dwrap{padding:10px 16px;white-space:normal}
.dhead{color:var(--chalk);font-weight:500;margin-bottom:6px;font-size:12px}
.dwrap table{width:auto;min-width:340px}
.dwrap td{border:0;padding:2px 18px 2px 0;font-size:11px;background:none}
.dts{color:var(--dim)}
.dnow{color:var(--m10)}

/* ── mobile cards ────────────────────────────────────────────── */
#cards{display:none;padding:8px}
.slab{color:var(--chalk);font-weight:700;font-size:12px;letter-spacing:1px;
      padding:10px 4px 6px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:6px;
      margin-bottom:8px;overflow:hidden}
.card.started{background:var(--live)}
.chead{display:flex;justify-content:space-between;align-items:flex-start;
       gap:8px;padding:8px 10px;border-bottom:1px solid var(--line)}
.chead > div:first-child{flex:1;min-width:0}
.crow{display:flex;align-items:center;gap:10px;line-height:1.5}
.crow .tname{flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;
             white-space:nowrap}
.crow .run{flex:0 0 auto;margin-left:2px}
.cstat{margin-top:3px}
.cmeta{text-align:right;font-size:11px;color:var(--dim);white-space:nowrap}
.mkts{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);
      gap:1px;background:var(--line)}
.mk{background:var(--panel2);padding:6px 8px;min-height:52px;
    min-width:0;overflow:hidden}
.card.started .mk{background:#4A1111}
.mk.hot{cursor:pointer}
.mk.sel{outline:1px solid var(--chalk);outline-offset:-1px}
.mklbl{color:var(--dim);font-size:10px;letter-spacing:.5px;margin-bottom:2px}
.mkln{font-size:12px;line-height:1.5;white-space:nowrap;
      overflow:hidden;text-overflow:ellipsis}
/* Full-width row inside the two-column market grid. */
.cpanel{grid-column:1 / -1}
.chist{background:#061014;padding:8px 10px;overflow-x:auto;
       -webkit-overflow-scrolling:touch}
/* R/H/E are separated from the innings by a rule rather than pinned: three
   sticky columns all at right:0 stack on top of each other, which is why the
   headers vanished. */
table.box .tot{border-left:1px solid var(--line)}
table.box th.tot{border-left:1px solid var(--line)}
.chist .dhead{font-size:11px}
.chist .hrow{display:flex;justify-content:space-between;font-size:11px;
             padding:1px 0}

@media (max-width:900px){
  table{display:none}
  table.box{display:table}          /* not the desktop board -- keep this one */
  #cards{display:block}
  .legend{font-size:10px}
  .legend div{padding:4px 1px}
  .bar h1{font-size:14px}
  .bar .meta{font-size:11px}

  /* Phone-only type scale. Desktop keeps the denser sizes above, since the
     table has to fit eleven columns and this layout only has two. */
  body{font-size:15px}
  .card .team{font-size:17px}
  .card .run{font-size:21px}
  .pit{font-size:12px}
  .st{font-size:12px}
  .drv{font-size:11px}
  .lp,.wp{font-size:11px}
  .rzb{font-size:10px}
  .ball{width:15px;height:9px}
  .cmeta{font-size:13px}
  .slab{font-size:14px}
  .mklbl{font-size:12px}
  .mkln{font-size:14px}
  .opn{font-size:11px}
  .side{font-size:13px;min-width:44px}
  @media (max-width:400px){
    .mkln{font-size:13px}
    .side{min-width:38px;max-width:74px;font-size:12px}
  }
  .chist .dhead{font-size:13px}
  .chist .hrow{font-size:13px;padding:2px 0}
  .mk{padding:8px 8px;min-height:64px}
}
</style>
</head>
<body>

<header>
  <div class="legend">
    <div style="background:#F07E7C">&lt;2 min</div>
    <div style="background:#EFC24B">2-5 min</div>
    <div style="background:#5DCAA5">5-10 min</div>
    <div style="background:#B9C6C2">no move</div>
    <div style="background:#5A1414;color:#F2F7F5">started</div>
  </div>
  <nav class="tabs" id="tabs"></nav>
  <div class="bar">
    <h1>BETONLINE.AG</h1>
    <div class="meta" id="meta">loading&hellip;</div>
  </div>
</header>

<table>
  <thead><tr id="head"></tr></thead>
  <tbody id="body"></tbody>
</table>
<div id="cards"></div>

<script>
const REFRESH_MS = 30000;
let DATA = null, OPEN = null, SPORTS = [], SPORT = null;
const CACHE = {};

/* Remembering the tab in the URL means a phone bookmark or a refresh lands
   where you left off, and the wall monitor can be pinned to one sport. */
function initialSport(){
  const q = new URLSearchParams(location.search).get("s");
  return q || null;
}

function mvClass(min, changed){
  if(!changed) return "";
  if(min < 2)  return "mv mv2";
  if(min < 5)  return "mv mv5";
  if(min < 10) return "mv mv10";
  return "";
}

const pit = (n, h) => `<div class="pit">${n ? n + (h ? "-" + h : "") : "&mdash;"}</div>`;

/* Possession marker. Only meaningful while a game is live, so it is gated on
   that rather than on the field being present -- ESPN leaves stale situation
   data on a game that has just ended. */
const BALL = '<svg class="ball" viewBox="0 0 22 13" aria-hidden="true">'
  + '<ellipse cx="11" cy="6.5" rx="10" ry="5.7" fill="currentColor"/>'
  + '<path d="M6.5 6.5h9M9 4.4v4.2M11 4.4v4.2M13 4.4v4.2" '
  + 'stroke="#08161B" stroke-width="1.1" stroke-linecap="round"/></svg>';

const poss = (g, side) => (g.live && g.poss === side) ? BALL : "";

/* Box score panel. Reuses the OPEN mechanism the odds history uses, with a
   reserved key, so opening a box closes any open history and vice versa --
   two panels under one game would push the row apart. */
const BOX = "__box";

function boxTable(g){
  const b = g.box;
  if(!b) return '<div class="bmsg">No box score yet.</div>';
  const A = g.away_short || g.away, H = g.home_short || g.home;

  if(b.kind === "innings"){
    const played = b.innings || [];
    if(!played.length) return '<div class="bmsg">Game has not started.</div>';
    /* Always show a full nine so the grid doesn't reflow as the game goes on,
       and keep any extras beyond that. Unplayed innings render blank. */
    const n = Math.max(9, played.length);
    const at = i => played.find(x => x.n === i + 1) || {};
    const head = Array.from({length: n}, (_, i) => `<th>${i + 1}</th>`).join("")
               + '<th class="tot">R</th><th class="tot">H</th><th class="tot">E</th>';
    const row = (name, key, rhe) =>
      `<tr><td class="bt">${name}</td>`
      + Array.from({length: n}, (_, i) => {
          const v = at(i)[key];
          return `<td>${v ?? ""}</td>`;
        }).join("")
      + ["0", "1", "2"].map(k => `<td class="tot">${(rhe || [])[k] ?? "-"}</td>`).join("")
      + "</tr>";
    return `<table class="box"><thead><tr><th></th>${head}</tr></thead><tbody>`
         + row(A, "a", b.rhe[0]) + row(H, "h", b.rhe[1]) + "</tbody></table>";
  }

  // periods
  const n = Math.max(b.away.length, b.home.length);
  if(!n) return '<div class="bmsg">Game has not started.</div>';
  const lbl = i => i < 4 ? "Q" + (i + 1) : (n === 5 ? "OT" : "OT" + (i - 3));
  const sum = a => a.reduce((x, y) => x + (Number(y) || 0), 0);
  const head = Array.from({length: n}, (_, i) => `<th>${lbl(i)}</th>`).join("")
             + '<th class="tot">T</th>';
  const row = (name, arr) =>
    `<tr><td class="bt">${name}</td>`
    + Array.from({length: n}, (_, i) => `<td>${arr[i] ?? "-"}</td>`).join("")
    + `<td class="tot">${sum(arr)}</td></tr>`;
  const lead = (b.leaders || []).map(l =>
    `<div class="lead"><span class="lcat">${l.cat}</span>`
    + `<span class="lwho">${l.who}${l.team ? " (" + (l.team === "away" ? A : H) + ")" : ""}</span>`
    + `<span class="lval">${l.val}</span></div>`).join("");
  return `<table class="box"><thead><tr><th></th>${head}</tr></thead><tbody>`
       + row(A, b.away) + row(H, b.home) + "</tbody></table>"
       + (lead ? `<div class="leads">${lead}</div>` : "");
}

/* Live baseball state: who is pitching now, and the market-independent win
   probability. Shown only while in play -- a final game's WP is 0/100 and a
   scheduled game has none. */
function livemlb(g){
  if(!g.live) return "";
  const bits = [];
  if(g.cur_pitcher){
    const chg = g.pitcher_changed ? '<span class="chg">NEW</span>' : "";
    const who = g.pitch_side === "home" ? (g.home || "")
              : g.pitch_side === "away" ? (g.away || "") : "";
    bits.push(`<div class="lp">${chg}P: ${g.cur_pitcher}${who ? " (" + who + ")" : ""}</div>`);
  }
  if(g.wp_home !== null && g.wp_home !== undefined){
    const hi = g.wp_home >= 50;
    const side = hi ? (g.home_short || g.home) : (g.away_short || g.away);
    const pct  = hi ? g.wp_home : g.wp_away;
    bits.push(`<div class="wp">WP ${side} ${Math.round(pct)}%</div>`);
  }
  return bits.join("");
}

/* Pitching decisions, shown in place of the probable starters once a game is
   final. Same amber as the live pitcher line: both answer "who is responsible
   for what is happening on the mound". */
function decisions(g){
  if(!g.final || !(g.win_p || g.lose_p)) return "";
  const W = g.win_side === "away" ? (g.away || "") : (g.home || "");
  const L = g.win_side === "away" ? (g.home || "") : (g.away || "");
  const out = [];
  if(g.win_p)  out.push(`<div class="lp">W: ${g.win_p}${W ? " (" + W + ")" : ""}</div>`);
  if(g.lose_p) out.push(`<div class="lp">L: ${g.lose_p}${L ? " (" + L + ")" : ""}</div>`);
  // A save always belongs to the winning club.
  if(g.save_p) out.push(`<div class="lp">S: ${g.save_p}${W ? " (" + W + ")" : ""}</div>`);
  return out.join("");
}

/* Down, distance and field position. One short line, shown under the clock. */
function drive(g){
  if(!g.live) return "";
  const bits = [];
  if(g.down) bits.push(g.down);
  if(g.spot && !(g.down || "").includes(g.spot)) bits.push(g.spot);
  if(!bits.length) return "";
  const rz = g.redzone ? '<span class="rzb">RZ</span>' : "";
  return `<div class="drv">${rz}${bits.join(" \u00b7 ")}</div>`;
}

/* AP rank prefix, e.g. "1 ALA". Absent for MLB and unranked teams. */
const rk = n => (n && n > 0 && n <= 25) ? `<span class="rank">${n}</span>` : "";

/* Neutral site is the thing you can't infer from the odds feed: home/away is
   arbitrary for those games. Venue only shown when it's neutral -- otherwise
   it's just the home team's stadium and adds noise. */
function venueLine(g){
  if(!g.neutral) return "";
  const where = [g.city, g.state].filter(Boolean).join(", ");
  return `<div class="neu">NEUTRAL${where ? " \u00b7 " + where : ""}</div>`;
}

/* The builder decides the wording per sport (build_site.status_text); the page
   only picks a colour. The old version had a baseball branch first, so a live
   football game took it and rendered an empty inning plus "0 out". */
function statusLine(g){
  if(!g.status_text) return "";
  const cls = g.live   ? "st live"
            : g.warmup ? "st warm"
            : g.final  ? "st fin"
            : "st";
  return `<div class="${cls}">${g.status_text}</div>`;
}

function sideHTML(s, which){
  const v = s[which] || "&mdash;";
  const k = which === "cur" ? mvClass(s.moved_min, s.changed) : "";
  const d = which === "cur" && s.changed ? '<span class="dot">&#9679;</span>' : "";
  let out = `<span class="side">${s.label}</span>`
          + `<span class="${which === "cur" ? "cur " + k : "open"}">${v}</span>${d}`;
  if(which === "cur" && s.changed && s.open && s.open !== s.cur){
    out += `<div class="opn"><span class="side"></span>${s.open}</div>`;
  }
  return out;
}

/* ── desktop ─────────────────────────────────────────────────── */
function cell(sides, which, gi, key){
  if(!sides || !sides.length) return "<td>&mdash;</td>";
  const any = sides.some(s => s.changed);
  const cls = (which === "cur" && any ? "hot" : "")
            + (OPEN && OPEN[0] === gi && OPEN[1] === key ? " sel" : "");
  const click = which === "cur" && any ? ` onclick="det(${gi},'${key}')"` : "";
  return `<td class="${cls}"${click}>`
       + sides.map(s => `<div>${sideHTML(s, which)}</div>`).join("") + "</td>";
}

function histRows(s){
  return (s.hist || [{ts: s.opened_at, line: s.cur}]).map((h, i) =>
    `<tr><td class="dts">${h.ts}</td><td class="${i ? "" : "dnow"}">${h.line}</td></tr>`
  ).join("");
}

function detailRow(gi, key){
  const g = DATA.games[gi];
  if(key === BOX){
    return `<tr class="det"><td colspan="${DATA.columns.length + 2}">
              <div class="dwrap">${boxTable(g)}</div></td></tr>`;
  }
  const label = DATA.columns.find(c => c.key === key).label;
  const blocks = (g.markets[key] || []).map(s =>
    `<div style="display:inline-block;vertical-align:top;margin-right:36px">
       <div class="dhead">${g.away} @ ${g.home} &mdash; ${label} &mdash; ${s.label}</div>
       <table>${histRows(s)}</table></div>`).join("");
  return `<tr class="det"><td colspan="${DATA.columns.length + 2}">
            <div class="dwrap">${blocks}</div></td></tr>`;
}

/* ── mobile ──────────────────────────────────────────────────── */
function mkBlock(g, gi, col){
  const sides = g.markets[col.key];
  if(!sides || !sides.length)
    return `<div class="mk"><div class="mklbl">${col.label}</div>
            <div class="mkln">&mdash;</div></div>`;
  const any = sides.some(s => s.changed);
  const cls = (any ? " hot" : "")
            + (OPEN && OPEN[0] === gi && OPEN[1] === col.key ? " sel" : "");
  const click = any ? ` onclick="det(${gi},'${col.key}')"` : "";
  return `<div class="mk${cls}"${click}><div class="mklbl">${col.label}</div>`
       + sides.map(s => `<div class="mkln">${sideHTML(s, "cur")}</div>`).join("")
       + "</div>";
}

function cardHist(gi, key){
  const g = DATA.games[gi];
  if(key === BOX) return `<div class="chist">${boxTable(g)}</div>`;
  const label = DATA.columns.find(c => c.key === key).label;
  return '<div class="chist">' + (g.markets[key] || []).map(s =>
    `<div class="dhead">${label} &mdash; ${s.label}</div>`
    + (s.hist || [{ts: s.opened_at, line: s.cur}]).map((h, i) =>
        `<div class="hrow"><span class="dts">${h.ts}</span>
         <span class="${i ? "" : "dnow"}">${h.line}</span></div>`).join("")
  ).join("") + "</div>";
}

function card(g, gi){
  const ar = (g.away_r ?? null) !== null ? ` <span class="run">${g.away_r}</span>` : "";
  const hr = (g.home_r ?? null) !== null ? ` <span class="run">${g.home_r}</span>` : "";
  const open = (OPEN && OPEN[0] === gi) ? OPEN[1] : null;
  const cols = DATA.columns;
  const cells = cols.map(c => mkBlock(g, gi, c));

  /* Drop the history panel into the grid immediately below the tapped cell
     rather than at the foot of the card. The grid is two columns, so the row
     containing cell i ends at i+1 when i is even and at i when it's odd --
     inserting mid-row would push its neighbour down a line. */
  if(open && open !== BOX){
    const i = cols.findIndex(c => c.key === open);
    if(i >= 0){
      const endOfRow = (i % 2 === 0) ? i + 1 : i;
      cells.splice(Math.min(endOfRow, cells.length - 1) + 1, 0,
                   `<div class="cpanel">${cardHist(gi, open)}</div>`);
    }
  }
  return `<div class="card${g.started ? " started" : ""}">
    <div class="chead${g.box ? " boxable" : ""}"${g.box ? ` onclick="det(${gi},'${BOX}')"` : ""}>
      <div>
        <div class="crow"><span class="tname">${poss(g, "away")}${rk(g.away_rank)}<span class="team">${g.away_short || g.away}</span>${(g.away_p && !g.live && !g.final) ? pit(g.away_p, g.away_ph) : ""}</span>${ar}</div>
        <div class="crow"><span class="tname">${poss(g, "home")}${rk(g.home_rank)}<span class="team">${g.home_short || g.home}</span>${(g.home_p && !g.live && !g.final) ? pit(g.home_p, g.home_ph) : ""}</span>${hr}</div>
        ${venueLine(g)}
        <div class="cstat">${statusLine(g)}${drive(g)}${livemlb(g)}${decisions(g)}</div>
      </div>
      <div class="cmeta">${g.time}${g.away_rot ? `<br>${g.away_rot}/${g.home_rot}` : ""}</div>
    </div>
    ${open === BOX ? cardHist(gi, BOX) : ""}
    <div class="mkts">${cells.join("")}</div>
  </div>`;
}

/* ── render ──────────────────────────────────────────────────── */
function renderTabs(){
  document.getElementById("tabs").innerHTML = SPORTS.map(s =>
    `<button class="${s.sport === SPORT ? "on" : ""}" onclick="pick('${s.sport}')">`
    + `${s.label}<span class="n">${s.games}</span></button>`).join("");
}

async function pick(sport){
  if(sport === SPORT) return;
  SPORT = sport;
  OPEN = null;                      // an open history panel belongs to the old sport
  history.replaceState(null, "", "?s=" + sport);
  renderTabs();
  await loadSport();
}

function render(){
  const d = DATA;
  const moved = d.games.reduce((a, g) => a + g.moves, 0);
  document.getElementById("meta").textContent =
    `${d.games.length} games \u00b7 ${moved} moved \u00b7 ${d.generated}`;
  document.title = `${d.label || "MLB"} odds \u2014 BetOnline`;

  document.getElementById("head").innerHTML =
      '<th class="l">Time</th><th class="l">Teams</th>'
    + d.columns.map(c => `<th>${c.label}</th>`).join("");

  const rows = [], cards = [];
  d.games.forEach((g, i) => {
    const prev = i ? d.games[i - 1] : null;
    const newSlate = (!prev || g.slate !== prev.slate) && g.slate_lbl;
    if(newSlate){
      rows.push(`<tr class="slate"><td colspan="${d.columns.length + 2}">${g.slate_lbl}</td></tr>`);
      cards.push(`<div class="slab">${g.slate_lbl}</div>`);
    }
    const rot = g.away_rot ? `<div class="time">${g.away_rot}<br>${g.home_rot}</div>` : "";
    rows.push(`<tr class="${i % 2 ? "g1" : "g0"}${g.started ? " started" : ""}">
        <td class="l time">${g.date}<br>${g.time}${rot}${statusLine(g)}${drive(g)}${livemlb(g)}${decisions(g)}</td>
        <td class="l${g.box ? " boxable" : ""}"${g.box ? ` onclick="det(${i},'${BOX}')"` : ""}>
          <div class="trow"><span class="tname">${poss(g, "away")}${rk(g.away_rank)}<span class="team">${g.away_full || g.away}</span></span>${(g.away_r ?? null) !== null ? `<span class="run">${g.away_r}</span>` : ""}</div>
          ${(g.away_p && !g.live && !g.final) ? pit(g.away_p, g.away_ph) : ""}
          <div class="trow"><span class="tname">${poss(g, "home")}${rk(g.home_rank)}<span class="team">${g.home_full || g.home}</span></span>${(g.home_r ?? null) !== null ? `<span class="run">${g.home_r}</span>` : ""}</div>
          ${(g.home_p && !g.live && !g.final) ? pit(g.home_p, g.home_ph) : ""}
          ${venueLine(g)}
        </td>
        ${d.columns.map(c => cell(g.markets[c.key], "cur", i, c.key)).join("")}
      </tr>`);
    if(OPEN && OPEN[0] === i) rows.push(detailRow(i, OPEN[1]));
    cards.push(card(g, i));
  });

  document.getElementById("body").innerHTML =
    rows.join("") || '<tr><td class="empty" colspan="12">No games. Run the poller.</td></tr>';
  document.getElementById("cards").innerHTML =
    cards.join("") || '<div class="empty">No games. Run the poller.</div>';
}

function det(gi, key){
  OPEN = (OPEN && OPEN[0] === gi && OPEN[1] === key) ? null : [gi, key];
  render();
}

async function loadSport(){
  const entry = SPORTS.find(s => s.sport === SPORT);
  if(!entry){
    document.getElementById("meta").textContent = "unknown sport " + SPORT;
    return;
  }
  let d;
  try{
    const r = await fetch(entry.file + "?t=" + Date.now());
    if(!r.ok) throw new Error("HTTP " + r.status);
    d = await r.json();
  }catch(e){
    document.getElementById("meta").textContent = entry.file + " not loaded \u2014 " + e.message;
    return;
  }
  /* Render failures are a separate problem from fetch failures; reporting them
     as "not loaded" sends you hunting for a file that arrived fine. */
  try{
    CACHE[SPORT] = d;
    DATA = d;
    render();
  }catch(e){
    document.getElementById("meta").textContent = "render error \u2014 " + e.message;
    console.error("render failed:", e);
    console.log("first game:", d.games && d.games[0]);
  }
}

/* ── live game state, fetched by the browser ──────────────────────────────
   Odds refresh on the build cycle (5 min, bounded by what the odds feed
   itself publishes). Game state doesn't need to ride that clock: both MLB's
   and ESPN's APIs are unauthenticated and update within seconds, so the page
   calls them directly and patches scores in place.

   Deliberately fail-quiet. If CORS blocks these, LIVE_OK flips off and the
   board carries on with build-cycle data -- a broken live overlay must never
   take the odds board down with it. */
const LIVE_MS = 30000;
let LIVE_OK = true, LIVE_TIMER = null;

function patch(g, o){
  for(const k in o) if(o[k] !== undefined && o[k] !== null) g[k] = o[k];
}

async function liveMLB(games){
  const days = [...new Set(games.map(g => g.slate))];
  for(const d of days){
    const r = await fetch("https://statsapi.mlb.com/api/v1/schedule"
      + `?sportId=1&date=${d}&hydrate=linescore`);
    if(!r.ok) throw new Error("HTTP " + r.status);
    const j = await r.json();
    const by = {};
    for(const day of (j.dates || []))
      for(const gm of (day.games || [])) by[gm.gamePk] = gm;

    for(const g of games){
      const gm = by[g.game_pk];
      if(!gm) continue;
      const ls = gm.linescore || {}, st = gm.status || {};
      const inPlay = st.abstractGameState === "Live"
                  && !["Warmup", "Pre-Game"].includes(st.detailedState);
      const half = ls.inningHalf || "", inn = ls.currentInning || "";
      patch(g, {
        away_r: (ls.teams?.away || {}).runs,
        home_r: (ls.teams?.home || {}).runs,
        cur_pitcher: (ls.defense?.pitcher || {}).fullName,
        live: inPlay, final: st.abstractGameState === "Final",
        status_text: st.abstractGameState === "Final" ? "Final"
                   : inPlay ? `${half} ${inn} \u00b7 ${ls.outs ?? 0} out`.trim()
                   : g.status_text,
      });
    }
  }
}

async function liveCFB(games){
  const r = await fetch("https://site.api.espn.com/apis/site/v2/sports/"
    + "football/college-football/scoreboard?limit=300");
  if(!r.ok) throw new Error("HTTP " + r.status);
  const j = await r.json();
  const by = {};
  for(const ev of (j.events || [])) by[ev.id] = ev;

  for(const g of games){
    const ev = by[g.espn_id];
    if(!ev) continue;
    const comp = (ev.competitions || [{}])[0];
    const st = (ev.status || {}).type || {};
    const sit = comp.situation || {};
    const side = {};
    for(const c of (comp.competitors || [])) side[c.homeAway] = c;
    const poss = Object.keys(side).find(
      k => String((side[k].team || {}).id) === String(sit.possession));
    patch(g, {
      away_r: (side.away || {}).score, home_r: (side.home || {}).score,
      live: st.state === "in", final: st.state === "post",
      status_text: st.shortDetail || g.status_text,
      poss: poss, down: sit.downDistanceText, spot: sit.possessionText,
      redzone: !!sit.isRedZone,
    });
  }
}

async function refreshLive(){
  if(!LIVE_OK || !DATA || document.hidden) return;
  const live = DATA.games.filter(g => g.live);
  if(!live.length) return;
  try{
    if(DATA.sport === "mlb")        await liveMLB(live);
    else if(DATA.sport === "ncaaf") await liveCFB(live);
    else return;
    render();
  }catch(e){
    // Almost certainly CORS. Stop retrying rather than erroring every 30s.
    LIVE_OK = false;
    console.warn("live refresh disabled:", e.message);
  }
}

async function load(){
  try{
    const r = await fetch("sports.json?t=" + Date.now());
    if(!r.ok) throw new Error("HTTP " + r.status);
    SPORTS = (await r.json()).sports || [];
  }catch(e){
    document.getElementById("meta").textContent = "sports.json not loaded \u2014 " + e.message;
    return;
  }
  if(!SPORTS.length) return;
  if(!SPORT || !SPORTS.some(s => s.sport === SPORT)){
    /* Prefer the URL, then the first sport that actually has games -- landing
       on an empty NCAAF board in June looks broken. */
    SPORT = initialSport()
         || (SPORTS.find(s => s.games > 0) || SPORTS[0]).sport;
  }
  renderTabs();
  await loadSport();
}
load();
setInterval(load, REFRESH_MS);
LIVE_TIMER = setInterval(refreshLive, LIVE_MS);
/* Catch up immediately when a backgrounded tab comes forward, rather than
   showing stale scores until the next tick. */
document.addEventListener("visibilitychange", () => {
  if(!document.hidden) refreshLive();
});
</script>
</body>
</html>
