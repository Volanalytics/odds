name: poll-odds

# GitHub's scheduler is best-effort: 5-minute minimum, and delays of 15-30
# minutes are routine at peak. The cron below is a safety net. For dependable
# timing, point an external scheduler (cron-job.org, free) at the
# workflow_dispatch API every 5 minutes.
on:
  push:
    branches: [main]
    # Only code changes should rebuild. The workflow commits to data/ and site/
    # every run, and while pushes made with GITHUB_TOKEN don't re-trigger
    # workflows, filtering here makes that guarantee explicit rather than
    # depending on it.
    paths-ignore:
      - "data/**"
      - "site/**"
      - "README.md"
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "leave blank for both; 'main' to skip period markets"
        required: false
        default: ""
      force:
        description: "ignore cadence table"
        required: false
        default: "false"

permissions:
  contents: write
  pages: write
  id-token: write

# Runs mutate committed data, so overlapping runs would race on the push.
# Queue them instead; never cancel, or a poll's records are lost.
concurrency:
  group: poll-odds
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          # A commit per poll makes full history pointless to fetch.
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # tzdata is NOT installed: zoneinfo reads the system tz database on
      # Linux runners. The pip package is only needed on Windows, where it was
      # in the local instructions.
      - run: pip install -r requirements.txt

      # One-time layout change, safe to leave here forever: moves the flat
      # data/odds + data/events.json into data/mlb/. Idempotent -- prints
      # "nothing to migrate" on every run after the first. Keeping it in the
      # workflow means the repo migrates itself without a local clone.
      - name: Migrate storage layout if needed
        run: python migrate_to_sports.py

      # Free endpoint, so refresh every sport's index every run.
      - name: Refresh event indexes
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          for S in mlb ncaaf; do
            python odds_poller.py --sport "$S" --mode skeleton
          done

      # Featured markets: 3 credits per sport for the whole slate, however
      # many games. Cheap enough to run for every sport every invocation --
      # the cadence tables skip most of these before any HTTP happens.
      - name: Poll main lines
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.force }}" = "true" ]; then ARGS="--force"; fi
          for S in mlb ncaaf; do
            python odds_poller.py --sport "$S" --mode main $ARGS
          done

      # Period markets, billed PER GAME: ~4 credits for MLB's 15, but ~8 keys
      # x 60 games on an NCAAF Saturday is ~480 a sweep. event_cadence in
      # sports.py is what keeps that affordable -- NCAAF only sweeps inside 6
      # hours of kickoff, so a Saturday clears in waves rather than one burst.
      #
      # This MUST be its own step: keying the mode off github.event.inputs
      # meant scheduled runs always got 'main' and deep never fired at all.
      - name: Poll period markets
        if: github.event.inputs.mode != 'main'
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.force }}" = "true" ]; then ARGS="--force"; fi
          for S in mlb ncaaf; do
            python odds_poller.py --sport "$S" --mode deep $ARGS
          done

      # Free: MLB Stats API needs no key and doesn't touch the odds quota.
      # Never fail the run over it -- a missing mlb.json degrades the board to
      # odds-only rather than losing the prices we already paid for.
      # Both are free public APIs, neither touches the odds quota. Never fail
      # the run over them: a missing enrich file degrades a board to odds-only
      # rather than losing prices we already paid credits for.
      - name: Pitchers and live scores (MLB)
        continue-on-error: true
        run: python mlb_enrich.py

      - name: Venues, neutral sites and scores (NCAAF)
        continue-on-error: true
        run: python espn_cfb_enrich.py

      - name: Build site
        env:
          ODDS_TZ: America/Chicago
          # Hours after first pitch a finished game stays on the board.
          ODDS_KEEP_HOURS: "12"
        run: python build_site.py --outdir site

      # Reads the NDJSON we already have; costs no odds credits.
      - name: Check for alert-worthy moves
        id: alerts
        env:
          ODDS_TZ: America/Chicago
        run: python alerts.py

      # Gmail needs an APP PASSWORD (Google account -> Security -> 2-Step
      # Verification -> App passwords). Your normal password will be rejected.
      - name: Send alert email
        if: steps.alerts.outputs.count != '0' && steps.alerts.outputs.count != ''
        continue-on-error: true
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          from: Odds Board
          to: ${{ secrets.MAIL_TO }}
          subject: "Line moves: ${{ steps.alerts.outputs.subject }}"
          body: file://data/alert_body.txt

      - name: Commit
        id: commit
        run: |
          set -u
          git config user.name  "odds-bot"
          git config user.email "odds-bot@users.noreply.github.com"

          # alert_body.txt is scratch for the mail step, rewritten every run.
          # Committing it achieved nothing and guaranteed an add/add conflict
          # whenever two writers overlapped.
          git add data site
          git reset -q data/alert_body.txt 2>/dev/null || true

          # Nothing changed on a cadence-skipped run; an empty commit would
          # add noise and burn a Pages build for no reason.
          if git diff --staged --quiet; then
            echo "no changes"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git commit -q -m "odds $(date -u +'%Y-%m-%d %H:%M')"

          # Push with retry. Everything under data/ and site/ is generated, so
          # there is no sensible three-way merge -- "-X ours" keeps this run's
          # freshly built output while still replaying onto whatever landed on
          # origin (a file upload, another run). Without it a human commit
          # during a run leaves the rebase half-applied and fails the job.
          for attempt in 1 2 3; do
            if git push -q origin HEAD:${{ github.ref_name }}; then
              echo "pushed on attempt $attempt"
              echo "changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "push rejected, rebasing (attempt $attempt)"
            git fetch -q origin ${{ github.ref_name }}
            if ! git rebase -q -X ours FETCH_HEAD; then
              git rebase --abort || true
              echo "rebase failed; leaving origin untouched"
              echo "changed=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done

          echo "could not push after 3 attempts"
          echo "changed=false" >> "$GITHUB_OUTPUT"

      # Uploading and deploying an unchanged site costs a second runner
      # allocation (~70s of the ~110s total) to publish bytes identical to
      # what is already live. Skip both when nothing moved.
      - uses: actions/upload-pages-artifact@v3
        if: steps.commit.outputs.changed == 'true'
        with:
          path: site

  deploy:
    needs: poll
    if: needs.poll.outputs.changed == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
