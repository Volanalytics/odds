name: poll-odds

# GitHub's scheduler is best-effort: 5-minute minimum, and delays of 15-30
# minutes are routine at peak. The cron below is a safety net. For dependable
# timing, point an external scheduler (cron-job.org, free) at the
# workflow_dispatch API every 5 minutes.
on:
  push:
    branches: [main]
    # Only code changes should rebuild. The workflow commits to data/ and site/
    # every run, and while pushes made with GITHUB_TOKEN don't re-trigger
    # workflows, filtering here makes that guarantee explicit rather than
    # depending on it.
    paths-ignore:
      - "data/**"
      - "site/**"
      - "README.md"
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "leave blank for both; 'main' to skip period markets"
        required: false
        default: ""
      force:
        description: "ignore cadence table"
        required: false
        default: "false"

permissions:
  contents: write
  pages: write
  id-token: write

# Runs mutate committed data, so overlapping runs would race on the push.
# Queue them instead; never cancel, or a poll's records are lost.
concurrency:
  group: poll-odds
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests tzdata

      - name: Refresh event index
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python odds_poller.py --mode skeleton

      # Featured markets: 3 credits for the whole slate.
      - name: Poll main lines
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.force }}" = "true" ]; then ARGS="--force"; fi
          python odds_poller.py --mode main $ARGS

      # F5 + team totals, ~4 credits per game. This MUST run on its own step:
      # keying the mode off github.event.inputs meant scheduled runs always got
      # 'main' and deep never fired at all. EVENT_CADENCE throttles it to about
      # one sweep per game per 30-60 min, so running it every invocation is
      # cheap -- most calls are skipped before any HTTP happens.
      - name: Poll period markets
        if: github.event.inputs.mode != 'main'
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.force }}" = "true" ]; then ARGS="--force"; fi
          python odds_poller.py --mode deep $ARGS

      # Free: MLB Stats API needs no key and doesn't touch the odds quota.
      # Never fail the run over it -- a missing mlb.json degrades the board to
      # odds-only rather than losing the prices we already paid for.
      - name: Pitchers and live scores
        continue-on-error: true
        run: python mlb_enrich.py

      - name: Build site
        env:
          ODDS_TZ: America/Chicago
          # Hours after first pitch a finished game stays on the board.
          ODDS_KEEP_HOURS: "12"
        run: python build_site.py --outdir site

      # Reads the NDJSON we already have; costs no odds credits.
      - name: Check for alert-worthy moves
        id: alerts
        env:
          ODDS_TZ: America/Chicago
        run: python alerts.py

      # Gmail needs an APP PASSWORD (Google account -> Security -> 2-Step
      # Verification -> App passwords). Your normal password will be rejected.
      - name: Send alert email
        if: steps.alerts.outputs.count != '0' && steps.alerts.outputs.count != ''
        continue-on-error: true
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          from: MLB odds board
          to: ${{ secrets.MAIL_TO }}
          subject: "Line moves: ${{ steps.alerts.outputs.subject }}"
          body: file://data/alert_body.txt

      - name: Commit
        run: |
          git config user.name  "odds-bot"
          git config user.email "odds-bot@users.noreply.github.com"
          git add data site
          # Nothing changed on a cadence-skipped run; an empty commit would
          # add noise and burn a Pages build for no reason.
          if git diff --staged --quiet; then
            echo "no changes"
          else
            git commit -m "odds $(date -u +'%Y-%m-%d %H:%M')"
            git pull --rebase --autostash origin ${{ github.ref_name }}
            git push
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: poll
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
